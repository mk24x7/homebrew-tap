name: brew test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Tap this checkout as mk24x7/tap
        run: |
          taps="$(brew --repository)/Library/Taps/mk24x7"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          # Homebrew 6+ ignores non-official taps until trusted; trust our own tap.
          brew trust mk24x7/tap
          brew tap

      - name: brew style
        run: brew style Formula/prune.rb Formula/prune-cli.rb Formula/stale.rb Casks/prune-app.rb Casks/stale-app.rb

      - name: brew audit (offline)
        run: |
          brew audit --strict --formula mk24x7/tap/prune mk24x7/tap/prune-cli mk24x7/tap/stale
          brew audit --strict --cask mk24x7/tap/prune-app mk24x7/tap/stale-app

      - name: brew audit --online
        # The formulae and casks carry placeholder sha256 values until the first
        # releases (prune v4.0.0, stale v1.0.0) exist, so the online audit cannot
        # pass yet. Remove continue-on-error after scripts/bump.sh and
        # scripts/bump-stale.sh have run for those versions.
        continue-on-error: true
        run: |
          brew audit --strict --online --formula mk24x7/tap/prune mk24x7/tap/prune-cli mk24x7/tap/stale
          brew audit --strict --online --cask mk24x7/tap/prune-app mk24x7/tap/stale-app

      - name: shellcheck
        run: |
          brew install shellcheck
          shellcheck scripts/*.sh
